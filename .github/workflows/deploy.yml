name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: cp env.example .env && php artisan key:generate --no-interaction

      - name: Run the test suite
        run: php artisan test --compact

  deploy:
    name: Deploy to cPanel
    needs: test
    runs-on: ubuntu-latest
    env:
      CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
      CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
      CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
      CPANEL_REPO_ROOT: ${{ secrets.CPANEL_REPO_ROOT }}
    steps:
      - name: Check the cPanel secrets
        run: |
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_API_TOKEN CPANEL_REPO_ROOT; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          [ -z "$missing" ]

      # cPanel's "Git Version Control" pulls the branch, then "Deploy HEAD Commit" runs the tasks in .cpanel.yml.
      - name: Pull the latest main on cPanel
        run: |
          curl --fail --silent --show-error --get \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --data-urlencode "repository_root=${CPANEL_REPO_ROOT}" \
            --data-urlencode "branch=main" \
            "https://${CPANEL_HOST}:2083/execute/VersionControl/update" | tee update.json
          jq -e '.status == 1' update.json > /dev/null || { echo "::error::cPanel could not pull: $(jq -r '.errors | join("; ")' update.json)"; exit 1; }

      - name: Deploy HEAD commit on cPanel
        run: |
          curl --fail --silent --show-error --get \
            --header "Authorization: cpanel ${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --data-urlencode "repository_root=${CPANEL_REPO_ROOT}" \
            "https://${CPANEL_HOST}:2083/execute/VersionControlDeployment/create" | tee deploy.json
          jq -e '.status == 1' deploy.json > /dev/null || { echo "::error::cPanel could not deploy: $(jq -r '.errors | join("; ")' deploy.json)"; exit 1; }
          echo "Deployment queued on cPanel. The tasks in .cpanel.yml run there (composer install, migrate, caches)."
